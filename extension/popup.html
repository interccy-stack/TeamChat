<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            width: 380px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f6fa;
            color: #2d3436;
        }
        /* ====== Header ====== */
        .header {
            text-align: center;
            padding: 22px 20px 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
        }
        .header-icon {
            font-size: 42px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .header-icon img {
            width: 44px; height: 44px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.3);
        }
        .header h1 { font-size: 22px; font-weight: 700; letter-spacing: 0.5px; }
        .header .sub { font-size: 12px; opacity: 0.8; margin-top: 3px; }
        .header .status-row {
            display: flex; align-items: center; justify-content: center;
            gap: 6px; margin-top: 10px; font-size: 12px;
        }
        .dot { width: 8px; height: 8px; border-radius: 50%; }
        .dot.online  { background: #52c41a; }
        .dot.offline { background: #ff4d4f; }
        .dot.loading { background: #faad14; animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
        /* ====== Body ====== */
        .body-content { padding: 16px 18px 18px; }
        /* Activated State */
        .card {
            background: #fff;
            border-radius: 12px;
            padding: 20px 18px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .card .icon-big { font-size: 48px; margin-bottom: 8px; }
        .card .icon-big img {
            width: 48px; height: 48px;
            border-radius: 50%;
        }
        .card .title   { font-size: 18px; font-weight: 700; color: #333; margin-bottom: 4px; }
        .card .desc    { font-size: 13px; color: #888; line-height: 1.5; }
        .card .actions { margin-top: 14px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
        .btn {
            padding: 8px 18px; border: none; border-radius: 8px;
            cursor: pointer; font-size: 13px; font-weight: 600;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.85; }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
        }
        .btn-outline {
            background: #fff; color: #764ba2;
            border: 2px solid #764ba2;
        }
        /* ====== Onboarding (First Use) ====== */
        .onboard-card {
            background: #fff;
            border-radius: 12px;
            padding: 20px 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .onboard-card .onboard-title {
            font-size: 16px; font-weight: 700; color: #333;
            margin-bottom: 12px; text-align: center;
        }
        .steps {
            background: #f8f9fc;
            border-radius: 10px;
            padding: 14px 16px;
            margin-bottom: 16px;
        }
        .steps .step {
            display: flex; align-items: flex-start;
            gap: 8px; margin-bottom: 8px;
        }
        .steps .step:last-child { margin-bottom: 0; }
        .steps .step-num {
            width: 22px; height: 22px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff; border-radius: 50%;
            font-size: 11px; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; margin-top: 1px;
        }
        .steps .step-text { font-size: 13px; color: #555; line-height: 1.5; }
        .steps .step-text strong { color: #764ba2; }
        .token-input-group {
            display: flex; gap: 8px; margin-bottom: 8px;
        }
        .token-input-group input {
            flex: 1; padding: 10px 12px;
            border: 2px solid #dfe6e9; border-radius: 8px;
            font-size: 13px; outline: none;
            transition: border-color 0.2s;
        }
        .token-input-group input:focus {
            border-color: #667eea;
        }
        .token-input-group input::placeholder {
            color: #b2bec3;
        }
        .token-input-group button {
            padding: 10px 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff; border: none; border-radius: 8px;
            cursor: pointer; font-size: 14px; font-weight: 600;
            white-space: nowrap; transition: opacity 0.2s;
        }
        .token-input-group button:hover { opacity: 0.85; }
        .token-hint {
            font-size: 12px; color: #888;
            padding-left: 2px; margin-bottom: 12px;
        }
        .auto-fetch-status {
            font-size: 12px; color: #aaa; text-align: center;
            padding: 4px 0;
        }
        .auto-fetch-status.success { color: #52c41a; }
        .auto-fetch-status.fail    { color: #ff4d4f; }
        /* ====== Features Grid ====== */
        .features {
            margin-top: 14px;
            display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
        }
        .feature {
            background: #fff; border-radius: 8px;
            padding: 10px; text-align: center;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
            font-size: 12px; color: #666;
        }
        .feature .emoji { display: block; font-size: 22px; margin-bottom: 4px; }
        /* ====== Footer ====== */
        .footer {
            text-align: center; padding: 10px;
            font-size: 11px; color: #b2bec3;
            border-top: 1px solid #eee;
        }
        /* ====== Error / Retry ====== */
        .retry-area { text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div class="header-icon">
            <img src="icon48_v2.png" alt="AI PRO">
        </div>
        <h1>AI PRO</h1>
        <div class="sub">TeamChat · 智能网页助手</div>
        <div class="status-row" id="statusRow">
            <span class="dot loading" id="statusDot"></span>
            <span id="statusLabel">检测中...</span>
        </div>
    </div>

    <!-- Body -->
    <div class="body-content">

        <!-- ====== Activated State (hidden by default) ====== -->
        <div class="card" id="activatedCard" style="display:none;">
            <div class="icon-big">
                <img src="icon48_v2.png" alt="ready">
            </div>
            <div class="title" id="activatedTitle">AI PRO 已就绪</div>
            <div class="desc" id="activatedDesc">在任何网页点击浮动按钮即可唤起 AI 助手</div>
            <div class="actions">
                <button class="btn btn-outline" id="resetTokenBtn">🔄 更换 Token</button>
            </div>
        </div>

        <!-- ====== Onboarding State (visible for first use) ====== -->
        <div class="onboard-card" id="onboardCard">
            <div class="onboard-title">🔐 首次使用请先配置 Token</div>

            <!-- Step guide -->
            <div class="steps">
                <div class="step">
                    <span class="step-num">1</span>
                    <span class="step-text">点击浏览器工具栏的 <strong>🤖</strong> 扩展图标</span>
                </div>
                <div class="step">
                    <span class="step-num">2</span>
                    <span class="step-text">在下方粘贴 <strong>访问Token</strong></span>
                </div>
                <div class="step">
                    <span class="step-num">3</span>
                    <span class="step-text">点击 <strong>激活</strong> 即可使用</span>
                </div>
            </div>

            <!-- Token input -->
            <div class="token-input-group">
                <input type="text" id="tokenInput" placeholder="在此粘贴访问Token...">
                <button id="activateBtn">✨ 激活</button>
            </div>
            <div class="token-hint">
                ⚡ 配置后自动生效，无需刷新页面
            </div>

            <!-- Auto-fetch indicator -->
            <div class="auto-fetch-status" id="autoFetchStatus">
                正在自动获取 Token...
            </div>

            <!-- Retry button (hidden) -->
            <div class="retry-area" id="retryArea" style="display:none;">
                <button class="btn btn-outline" id="retryBtn">🔄 重新连接获取</button>
            </div>
        </div>

        <!-- Features (always visible) -->
        <div class="features">
            <div class="feature"><span class="emoji">🌐</span>智能感知</div>
            <div class="feature"><span class="emoji">⚡</span>快捷指令</div>
            <div class="feature"><span class="emoji">🎤</span>语音输入</div>
            <div class="feature"><span class="emoji">🧠</span>跨页记忆</div>
        </div>
    </div>

    <div class="footer">v5.2.0 · 在任何网页随时唤醒 AI 助手</div>

    <script src="popup.js"></script>
</body>
</html>
